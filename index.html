<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Tutor RS</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f13; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50% { transform: translateY(-6px); opacity: 1; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    textarea::placeholder { color: #555; }
    input::placeholder { color: #555; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const LANGUAGES = [
      { code: "en", label: "English 🇬🇧" },
      { code: "bn", label: "Bengali 🇧🇩" },
      { code: "it", label: "Italian 🇮🇹" },
      { code: "es", label: "Spanish 🇪🇸" },
      { code: "de", label: "German 🇩🇪" },
      { code: "zh", label: "Chinese 🇨🇳" },
      { code: "ja", label: "Japanese 🇯🇵" },
      { code: "pt", label: "Portuguese 🇵🇹" },
      { code: "tr", label: "Turkish 🇹🇷" },
      { code: "ar", label: "Arabic 🇸🇦" },
      { code: "hi", label: "Hindi 🇮🇳" },
      { code: "ne", label: "Nepali 🇳🇵" },
    ];

    const NAMES = {
      en:"English",bn:"Bengali",it:"Italian",es:"Spanish",
      de:"German",zh:"Chinese",ja:"Japanese",pt:"Portuguese",
      tr:"Turkish",ar:"Arabic",hi:"Hindi",ne:"Nepali"
    };

    const SYSTEM = (lang) =>
      `You are a friendly ${NAMES[lang]} language tutor. Rules:
1. Chat naturally in ${NAMES[lang]}.
2. Gently correct 1-2 mistakes max — like a friend, not a teacher.
3. Keep replies SHORT (2-4 sentences).
4. Always end with a simple follow-up question.
5. If student writes Bengali, translate it to ${NAMES[lang]} and teach them.
6. Be warm and encouraging. Never make them feel bad.
Add Bengali translation in [] when helpful.`;

    function App() {
      const [apiKey, setApiKey] = useState("");
      const [keyOk, setKeyOk] = useState(false);
      const [lang, setLang] = useState(null);
      const [msgs, setMsgs] = useState([]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const [listening, setListening] = useState(false);
      const [keyInput, setKeyInput] = useState("");
      const [keyError, setKeyError] = useState("");
      const bottomRef = useRef(null);

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [msgs, loading]);

      const callAI = async (history, currentLang, currentKey) => {
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": currentKey,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-allow-browser": "true"
          },
          body: JSON.stringify({
            model: "claude-haiku-4-5-20251001",
            max_tokens: 300,
            system: SYSTEM(currentLang),
            messages: history
          })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        return data.content[0].text;
      };

      const submitKey = async () => {
        const k = keyInput.trim();
        if (!k.startsWith("sk-ant-")) {
          setKeyError("❌ Key টা ঠিক নেই। sk-ant- দিয়ে শুরু হওয়া উচিত।");
          return;
        }
        setKeyError("checking...");
        try {
          await callAI([{role:"user",content:"hi"}], "en", k);
          setApiKey(k);
          setKeyOk(true);
          setKeyError("");
        } catch(e) {
          setKeyError("❌ Key কাজ করছে না: " + e.message);
        }
      };

      const startChat = async (selectedLang) => {
        setLang(selectedLang);
        setMsgs([]);
        setLoading(true);
        try {
          const reply = await callAI(
            [{role:"user", content:"Start now. Greet me warmly and ask one simple question."}],
            selectedLang, apiKey
          );
          setMsgs([{role:"assistant", content:reply}]);
        } catch(e) {
          setMsgs([{role:"assistant", content:"Sorry, error: " + e.message}]);
        }
        setLoading(false);
      };

      const send = async () => {
        if (!input.trim() || loading) return;
        const userMsg = {role:"user", content:input.trim()};
        const history = [...msgs, userMsg];
        setMsgs(history);
        setInput("");
        setLoading(true);
        try {
          const reply = await callAI(history, lang, apiKey);
          setMsgs([...history, {role:"assistant", content:reply}]);
        } catch(e) {
          setMsgs([...history, {role:"assistant", content:"Error: " + e.message}]);
        }
        setLoading(false);
      };

      const onKey = (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
      };

      const voiceInput = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { alert("Chrome browser use করো voice এর জন্য"); return; }
        const r = new SR();
        r.lang = lang || "en-US";
        r.onresult = (e) => setInput(p => p + " " + e.results[0][0].transcript);
        r.onend = () => setListening(false);
        r.onerror = () => setListening(false);
        r.start();
        setListening(true);
      };

      // SCREEN 1: API Key
      if (!keyOk) return (
        <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0f0c29,#302b63,#24243e)",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>
          <div style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:"24px",padding:"40px 32px",maxWidth:"400px",width:"100%",textAlign:"center"}}>
            <div style={{fontSize:"50px",marginBottom:"16px"}}>🔑</div>
            <h2 style={{color:"#fff",fontSize:"22px",marginBottom:"8px",fontWeight:"700"}}>API Key দাও</h2>
            <p style={{color:"#aaa",fontSize:"13px",marginBottom:"8px"}}>
              <a href="https://console.anthropic.com/settings/keys" target="_blank" style={{color:"#6c63ff"}}>console.anthropic.com</a> থেকে key নাও
            </p>
            <p style={{color:"#777",fontSize:"12px",marginBottom:"24px"}}>Key শুধু তোমার browser এ থাকবে — কোথাও save হবে না ✅</p>
            <input
              type="password"
              placeholder="sk-ant-api03-..."
              value={keyInput}
              onChange={e => { setKeyInput(e.target.value); setKeyError(""); }}
              onKeyDown={e => e.key==="Enter" && submitKey()}
              style={{width:"100%",padding:"12px 16px",borderRadius:"12px",border:"1px solid rgba(255,255,255,0.2)",background:"rgba(255,255,255,0.06)",color:"#fff",fontSize:"14px",outline:"none",marginBottom:"12px"}}
            />
            {keyError && <p style={{color: keyError==="checking..." ? "#aaa" : "#ff6b6b", fontSize:"13px",marginBottom:"12px"}}>{keyError}</p>}
            <button
              onClick={submitKey}
              style={{width:"100%",padding:"14px",borderRadius:"12px",border:"none",background:"linear-gradient(135deg,#6c63ff,#48cfad)",color:"#fff",fontSize:"16px",fontWeight:"700",cursor:"pointer"}}
            >
              {keyError==="checking..." ? "যাচাই করছি..." : "শুরু করো →"}
            </button>
          </div>
        </div>
      );

      // SCREEN 2: Language Select
      if (!lang) return (
        <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0f0c29,#302b63,#24243e)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"20px"}}>
          <div style={{textAlign:"center",marginBottom:"40px"}}>
            <div style={{fontSize:"56px",marginBottom:"12px"}}>🌍</div>
            <h1 style={{color:"#fff",fontSize:"28px",fontWeight:"700",margin:"0 0 8px"}}>Language Tutor RS</h1>
            <p style={{color:"#aaa",fontSize:"15px"}}>কোন ভাষা শিখতে চাও? একটা select করো 👇</p>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:"12px",maxWidth:"520px",width:"100%"}}>
            {LANGUAGES.map(l => (
              <button key={l.code} onClick={() => startChat(l.code)}
                style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",color:"#fff",borderRadius:"14px",padding:"16px 10px",fontSize:"14px",cursor:"pointer",fontWeight:"500",transition:"all 0.2s"}}
                onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,0.18)"}
                onMouseLeave={e=>e.currentTarget.style.background="rgba(255,255,255,0.07)"}
              >{l.label}</button>
            ))}
          </div>
        </div>
      );

      // SCREEN 3: Chat
      return (
        <div style={{minHeight:"100vh",background:"#0f0f13",display:"flex",flexDirection:"column"}}>
          {/* Header */}
          <div style={{padding:"14px 20px",background:"rgba(255,255,255,0.04)",borderBottom:"1px solid rgba(255,255,255,0.08)",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
            <div>
              <span style={{color:"#fff",fontWeight:"700",fontSize:"16px"}}>🎓 {NAMES[lang]} Tutor RS</span>
              <span style={{color:"#555",fontSize:"12px",marginLeft:"10px"}}>AI-powered • Free</span>
            </div>
            <button onClick={()=>setLang(null)}
              style={{background:"rgba(255,80,80,0.15)",border:"1px solid rgba(255,80,80,0.3)",color:"#ff6b6b",borderRadius:"8px",padding:"6px 14px",fontSize:"13px",cursor:"pointer"}}>
              ← ভাষা বদলাও
            </button>
          </div>

          {/* Messages */}
          <div style={{flex:1,overflowY:"auto",padding:"20px",display:"flex",flexDirection:"column",gap:"14px"}}>
            {msgs.map((m,i) => (
              <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",alignItems:"flex-end",gap:"10px"}}>
                {m.role==="assistant" && (
                  <div style={{width:"34px",height:"34px",borderRadius:"50%",background:"linear-gradient(135deg,#6c63ff,#48cfad)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"16px",flexShrink:0}}>🤖</div>
                )}
                <div style={{maxWidth:"72%",padding:"12px 16px",borderRadius:m.role==="user"?"18px 18px 4px 18px":"18px 18px 18px 4px",background:m.role==="user"?"linear-gradient(135deg,#6c63ff,#574fd6)":"rgba(255,255,255,0.08)",color:"#fff",fontSize:"14px",lineHeight:"1.7",border:m.role==="assistant"?"1px solid rgba(255,255,255,0.1)":"none",whiteSpace:"pre-wrap"}}>
                  {m.content}
                </div>
                {m.role==="user" && (
                  <div style={{width:"34px",height:"34px",borderRadius:"50%",background:"linear-gradient(135deg,#f7971e,#ffd200)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"16px",flexShrink:0}}>😊</div>
                )}
              </div>
            ))}
            {loading && (
              <div style={{display:"flex",alignItems:"flex-end",gap:"10px"}}>
                <div style={{width:"34px",height:"34px",borderRadius:"50%",background:"linear-gradient(135deg,#6c63ff,#48cfad)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"16px"}}>🤖</div>
                <div style={{background:"rgba(255,255,255,0.08)",borderRadius:"18px 18px 18px 4px",padding:"14px 18px",border:"1px solid rgba(255,255,255,0.1)"}}>
                  <div style={{display:"flex",gap:"5px"}}>
                    {[0,1,2].map(i=>(
                      <div key={i} style={{width:"8px",height:"8px",borderRadius:"50%",background:"#6c63ff",animation:"bounce 1.2s ease-in-out infinite",animationDelay:`${i*0.2}s`}}/>
                    ))}
                  </div>
                </div>
              </div>
            )}
            <div ref={bottomRef}/>
          </div>

          {/* Input */}
          <div style={{padding:"14px 16px",background:"rgba(255,255,255,0.03)",borderTop:"1px solid rgba(255,255,255,0.07)",flexShrink:0}}>
            <div style={{display:"flex",gap:"10px",alignItems:"flex-end",maxWidth:"760px",margin:"0 auto"}}>
              <button onClick={voiceInput} disabled={listening}
                style={{width:"44px",height:"44px",borderRadius:"50%",border:"none",cursor:"pointer",background:listening?"linear-gradient(135deg,#ff4757,#ff6b81)":"rgba(255,255,255,0.1)",color:"#fff",fontSize:"18px",flexShrink:0}}>
                {listening?"🔴":"🎙️"}
              </button>
              <textarea
                value={input}
                onChange={e=>setInput(e.target.value)}
                onKeyDown={onKey}
                placeholder={`${NAMES[lang]} বা বাংলায় type করো... (Enter = send)`}
                rows={1}
                style={{flex:1,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",color:"#fff",borderRadius:"14px",padding:"12px 16px",fontSize:"14px",resize:"none",outline:"none",fontFamily:"inherit",lineHeight:"1.5",maxHeight:"120px"}}
              />
              <button onClick={send} disabled={loading||!input.trim()}
                style={{width:"44px",height:"44px",borderRadius:"50%",border:"none",cursor:"pointer",background:loading||!input.trim()?"rgba(255,255,255,0.1)":"linear-gradient(135deg,#6c63ff,#48cfad)",color:"#fff",fontSize:"18px",flexShrink:0}}>
                ➤
              </button>
            </div>
            <p style={{textAlign:"center",color:"#444",fontSize:"11px",marginTop:"8px"}}>
              ভুল হলে AI আস্তে আস্তে correct করবে 🌟 কোনো data save হয় না • সম্পূর্ণ ফ্রি
            </p>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
